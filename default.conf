server {
  listen 80;
  # bcrypt password wall — /etc/nginx/.htpasswd is written by start.sh from
  # W3SITE_BASIC_AUTH_USER/_HASH; the container refuses to start without them.
  auth_basic "w3champions dev";
  auth_basic_user_file /etc/nginx/.htpasswd;
  location ~* \.(jpg|jpeg|png|svg|gif|ico|css|js|woff|woff2|ttf)$ {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    expires 30d;
  }
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    expires -1;
  }
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
